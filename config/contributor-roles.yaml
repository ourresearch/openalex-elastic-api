descrFull: The CRediT roles (Contributor Roles Taxonomy, credit.niso.org) an author played on a work, such as Conceptualization or Software, as stated for that author in Crossref deposits, PubMed Central article XML, or an author contributions statement in the article's text that uses CRediT's own terms. Never guessed from the byline.
