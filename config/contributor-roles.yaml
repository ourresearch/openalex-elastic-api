id: contributor-roles
displayName: contributor roles
displayNameSingular: contributor role
descr: the part a person played on a work
descrFull: The part a person played on a work. One of CRediT's fourteen roles (Contributor Roles Taxonomy, credit.niso.org), such as Conceptualization or Software, as stated for that person in Crossref deposits, PubMed Central article XML, or an author contributions statement in the article's text that uses CRediT's own terms; or Editor, a person who edited the work, as Crossref and other sources list them. Editor is not CRediT's Writing – review & editing, which is commenting on a draft. Never guessed from the byline.
isNative: false
idRegex: (?:https:\/\/openalex\.org\/contributor-roles\/|contributor-roles\/)([a-z0-9-]+)
